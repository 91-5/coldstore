name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # P2 review B1 regression guard: a bare .gitignore rule once silently
  # excluded core sources, so the commit compiled locally but a clean
  # checkout did not. Verify tracked files include the core modules
  # before running anything else.
  tracked-sources:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core sources must be tracked (not gitignore-shadowed)
        run: |
          $missing = @()
          foreach ($f in @('crates/coldstore-core/src/quarantine/mod.rs','crates/coldstore-core/src/quarantine/journal.rs','crates/coldstore-core/src/ntfs/mod.rs','crates/coldstore-core/src/ntfs/sys.rs','crates/coldstore-cli/tests/p7_container_autocreate.rs')) {
            git ls-files --error-unmatch $f 2>$null
            if ($LASTEXITCODE -ne 0) { $missing += $f }
          }
          if ($missing.Count -gt 0) { throw "gitignore-shadowed core sources: $($missing -join ', ')" }
          Write-Output 'OK: all core sources tracked'

  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
